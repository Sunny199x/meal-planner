<main><h1>Grandma's lentil soup</h1>
<p>Serves 4. Takes about 40 minutes.</p>
<h2>Ingredients</h2><ul><li>250 g red lentils</li><li>1 onion</li><li>1 l vegetable stock</li></ul>
<h2>Method</h2><ol><li>Fry the onion.</li><li>Add the lentils and stock and simmer for 25 minutes.</li></ol>
